<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de relações com clientes</title>
    <link rel="shortcut icon" href="./imgs/Book.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
    <div class="criar-cliente" id="form">
        <div class="forms">
            <input class="inpt-text" type="text" placeholder="Adicionar contato..." id="contatoAdd">
            <input class="inpt-text" type="text" placeholder="Adicionar empresa..." id="empresaAdd">
            <input class="inpt-text" type="text" placeholder="Adicionar departamento..." id="departamentoAdd">
            <input class="inpt-text" type="text" placeholder="Informações adicionais..." id="informacoesAdd">
            <div class="btnschecks">
                <h2>STATUS</h2>
                <div class="input-text rec-check"><img src="./imgs/Rectangle 13.png" alt=""><span>Ativo</span></div>
                <div class="input-text rec-check"><img src="./imgs/Rectangle 13.png" alt=""><span>Ausente</span></div>
                <div class="input-text rec-check"><img src="./imgs/Rectangle 13.png" alt=""><span>Inativo</span></div>
            </div>
            <div class="botoes-aceitar-fechar">
                <button class="btn-aceitar" onclick="criarCliente()">Aceitar</button>
                <button class="btn-voltar" onclick="openForms()">Voltar</button>
            </div>
        </div>
    </div>
    <div class="criar-lixo" id="lixo">
        <div class="forms">
            <div class="titulo-lixo">
                <h3>Lixeira</h3>
                <img src="./imgs/x-square.svg" alt="fechar" onclick="fecharLixeira()">
            </div>
            <div class="list-of-people-trash" id="listaLixeira">
                <!-- itens renderizados via JS (renderizarLixeira) -->
            </div>
        </div>
    </div>
    <header>
        <div class="titulo">
            <div class="icon">
                <img src="./imgs/Book.svg" alt="">
            </div>
            <h1>Gerenciamento de relações com clientes</h1>
        </div>
        <div class="botoes-add-trash">
            <button onclick="openForms()" class="novo-botao-contaot">
                <img src="./imgs/NovoIcon.svg" alt="icone-add" style="pointer-events: none;">Novo
            </button>
            <button onclick="abrirLixeira()" class="lixo-b">
                <img src="./imgs/Trash.svg" alt="lixoIcon" style="pointer-events: none;">Lixo
            </button>
        </div>
    </header>
    <nav>
        <div class="contatos-h2">
            <h2>CONTATOS</h2>
        </div>
        <div class="contatos" id="contatos">
            <!-- contatos renderizados via JS (renderizarCliente) -->
        </div>
        <div class="add" onclick="openForms()">
            <img src="./imgs/add_circle.svg" alt="">
            <h2>ADICIONAR NOVO CONTATO</h2>
        </div>
    </nav>
</body>
<script src="./script.js"></script>
</html>
