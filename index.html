<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de relações com clientes</title>
    <link rel="shortcut icon" href="./imgs/Book.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="titulo">
            <div class="icon">
                <img src="../imgs/Book.svg" alt="">
            </div>
            <h1>Gerenciamento de relações com clientes</h1>
        </div>

        <div class="botoes-add-trash">
            <button class="novo-botao-contaot"><img src="./imgs/NovoIcon.svg" alt="icone-adds.svg">Novo</button>
            <button class="lixo-b"><img src="./imgs/Trash.svg" alt="lixoIcon.svg">Lixo</button>
        </div>
    </header>
    <nav>
        <div class="contatos-h2">
            <h2>CONTATOS</h2>
        </div>
        <div class="contatos">
            <div class="cliente">
                <div class="profile-pic"><p>MW</p></div>
                <p class="dados">Mark Watney - </p>
                <span class="dados">NASA - </span>
                <span class="dados">Departamento de botânica</span>
                <div class="status">
                    <p>STATUS</p>
                    <div class="status-ball"></div>
                </div>
            </div>
        </div>
        <div class="add">
            <img src="./imgs/add_circle.svg" alt="">
            <h2>ADICIONAR NOVO CONTATO</h2>
        </div>
    </nav>
</body>
<script src="../scripts/script.js"></script>
</html>
